<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PPE Detection</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>PPE Detection</h1>
        <p>Live safety-equipment detection system</p>
      </div>
    </header>
    <!-- Source Toggle -->
    <div class="source-toggle">
      <button id="btn-webcam" class="toggle-btn active">
        Live Camera
      </button>
      <button id="btn-video" class="toggle-btn">
        Video
      </button>
    </div>
    <!-- Video Selection -->
    <section class="video-panel" id="video-panel">
      <div class="panel-title">Video Source</div>
      <div class="video-select-section">
        <label for="video-select">Select a video from video/</label>
        <div class="input-row">
          <select id="video-select">
            <option value="">Select a video...</option>
          </select>
          <button class="primary-btn" id="load-video-btn">
            Load Video
          </button>
        </div>
      </div>
      <div class="divider">
        <span>OR</span>
      </div>
      <div class="upload-section">
        <label for="video-upload">Upload a video</label>
        <div class="input-row">
          <input type="file" id="video-upload" accept=".mp4,.mov,.avi,.mkv">
          <button class="primary-btn" id="upload-btn">
            Upload & Play
          </button>
        </div>
        <span class="upload-status" id="upload-status"></span>
      </div>
    </section>
    <!-- Detection Feed -->
    <section class="video-container">
      <img id="feed" alt="PPE detection feed">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-title">No video selected</div>
        <div class="placeholder-text">
          Select a video source to start detection
        </div>
      </div>
    </section>
    <!-- Status -->
    <div class="status">
      <span class="status-dot"></span>
      <span id="status-text">
        Source: Live Camera
      </span>
    </div>
    <button class="restart-btn" id="reload-btn">
      Restart Stream
    </button>
  </main>
  <script src="/static/script.js"></script>
</body>

</html>
